# fly.toml app configuration file generated for travellers-isle-frontend on 2025-12-14T21:29:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'travellers-isle-frontend'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
